<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblatenjagd</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; outline: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<!-- miniquad's loader (see README.md for its origin, version and licence). -->
<script src="gl.js"></script>
<!-- quad-snd's WebAudio plugin for macroquad's audio (see README.md); after gl.js. -->
<script src="audio.js"></script>
<script>
  // Marks the page once the wasm module is instantiated (used by
  // `cargo xtask wasm-smoke`); on_init runs right before the game's main().
  miniquad_add_plugin({
    register_plugin: function (importObject) {},
    on_init: function () { document.body.dataset.wasm = "loaded"; },
    name: "jnr_marker",
    version: 1,
  });
  load("jnr-app.wasm");
  document.getElementById("glcanvas").focus();
</script>
</body>
</html>
