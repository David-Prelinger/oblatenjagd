# Stage 1 near layer: old-town (Altstadt) roofs, domes and towers behind
# the street, parallax factor ~0.8 (13/16). FIRST DRAFT by the engine
# engineer: the pixel-artist tunes it (or hand-draws it), the art-director
# reviews it. Colours per docs/art-style.md §7 near layer: facades `c p o`
# (never `Y` as main fill), terracotta `E`/`n` and red `r`/`R` roofs with an
# `n`/`R` eave, copper domes and spires `t`/`T`, windows `d` (2x3) or `T`.

[[skyline]]
name   = "bg_rooftops"
width  = 640
height = 96
seed   = 21

