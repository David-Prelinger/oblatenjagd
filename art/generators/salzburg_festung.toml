# Stage 1 mid layer: Festung Hohensalzburg on the Festungsberg, parallax
# factor ~0.5 (8/16). FIRST DRAFT by the engine engineer: the pixel-artist
# tunes it (or hand-draws it as a .sprite), the art-director reviews it.
# Colours per docs/art-style.md §7: `v` dominant (>= 60 %), `G` for shadow
# masses, `i m` only for the fortress silhouette.

