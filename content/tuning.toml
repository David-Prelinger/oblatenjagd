# Gameplay constants for jnr-core (parsed by `Tuning::parse`).
#
# Units: speeds in subpixels per frame, accelerations in subpixels per frame²
# (1 px = 256 subpixels, 60 frames per second), durations in frames.
# Integers only (hitbox sizes are whole pixels). The px equivalents in the comments are for humans.
# Targets: docs/game-design.md "Movement feel"; they are asserted by the
# game-feel tests in crates/jnr-core/src/tests/feel.rs.

[player]
walk_speed = 384          # 1.5 px/frame
run_speed = 640           # 2.5 px/frame
ground_accel = 24         # ~0.094 px/frame²: 0 -> walk in 16 frames, -> run in 27
friction = 16             # 0.0625 px/frame²: walk -> stop in 24 frames
skid_decel = 40           # ~0.156 px/frame²: run -> 0 in 16 frames when turning
air_accel = 16            # 0.0625 px/frame²
jump_speed_walk = 1048    # ~4.09 px/frame upwards
jump_speed_run = 1168     # ~4.56 px/frame upwards at full run speed
gravity_hold = 32         # 0.125 px/frame² while rising with JUMP held
gravity = 88              # ~0.344 px/frame² otherwise
max_fall_speed = 1024     # 4.0 px/frame
coyote_frames = 6         # 0.1 s
jump_buffer_frames = 6    # 0.1 s
hitbox_w = 12             # px (whole pixels): smaller than the 16x24 sprite, forgiving
hitbox_h = 22             # px; the feet are at the hitbox's bottom centre (Normal)
hitbox_h_big = 30         # px as Zuckerschock (sprite 16x32); growing keeps the feet in place
stomp_bounce = 900        # upward speed after a stomp, JUMP not held: rise ~1 tile
stomp_bounce_held = 940   # with JUMP held (gravity_hold while held): rise ~3 tiles
invulnerable_frames = 120 # 2 s after shrinking (counted after the transformation freeze)
transform_frames = 30     # the game freezes while growing or shrinking
water_sink_px = 8         # px the feet sink into water before it kills (D-050); spikes kill on touch

[camera]
follow_x = 144            # px: camera scrolls right once the player's centre passes this screen x
deadzone_top = 64         # px: vertical dead zone for the player's centre (screen y)
deadzone_bottom = 120
# Climb camera, levels with `[meta] camera = "climb"` (D-054); other levels ignore these.
climb_feet_y = 148        # px: grounded, the camera settles with the feet at this screen y ...
climb_settle_speed = 2    # ... moving at most 2 px per frame
climb_up_slack = 48       # px: grounded, a step up of at most this (3 tiles) above the settled ground keeps the camera (D-065) ...
climb_up_reach = 48       # px: ... while she stays within this many px (horizontally) of where she stepped up
climb_top = 40            # px: in the air it follows up at once when the hitbox top is above this screen y
climb_top_min = 11        # px: while the slack below holds, that line is climb_top minus the lag, but at least this (D-065: a walk jump's apex from a held 3-tile box)
climb_catch_up_speed = 6  # px: grounded with the top above climb_top, the camera moves up this much more per frame
climb_fall_follow = 80    # px: and follows a fall at most this far below the last ground's settle framing
climb_goal_feet_y = 164   # px: the goal sequence settles the feet here (frames the meadow like Stages 1-3)
climb_activate_y = 64     # px: an entity activates only while its spawn cell is this close to the screen vertically
# Auto-scroll camera, levels with `[meta] camera = "autoscroll"` (D-075); other levels ignore these.
autoscroll_speed = 192    # subpx/frame: 0.75 px/frame, half the walk speed (must be > 0, < player.walk_speed and < swim.speed)
autoscroll_hold = 60      # frames of play the scroll waits after a start or respawn framed inside the zone
autoscroll_right_margin = 64  # px: in the scroll the hitbox's right edge stays <= camera x + 320 - this
autoscroll_settle_speed = 2   # px/frame: grounded or swimming at the surface, the camera settles back to its rest, the level's bottom clamp (D-086)
autoscroll_catch_up_speed = 4 # px/frame: in the lead-out the camera catches up with her at most this fast, no snap at the hand-over (> run_speed; D-086)
autoscroll_ground_y = 84      # screen y: standing, the camera settles with her ground's top here (decks on row 11 -> the bottom clamp; D-090)
autoscroll_top = 24           # level y: the camera's top clamp in every phase; at 24 the row-12 water line is at screen y 168 and swans/regatta keels stay fully on screen (D-090)

[game]
death_frames = 60         # 1 s from death to respawn
game_over_frames = 60     # GameOver: START restarts the stage after this many frames
intro_frames = 150        # stage intro screen (title flow: at the start and after every death)
lives_start = 3
lives_max = 99
oblaten_per_life = 100    # 100 Oblaten -> +1 life, counter back to 0
activate_margin = 320     # px beyond the right screen edge: entities activate (one screen)
despawn_margin = 64       # px left of the screen: entities are removed

[items]
oblate_hitbox = [10, 10]        # px [w, h]
mozartkugel_hitbox = [10, 10]
zaunerstollen_hitbox = [14, 10]
rise_frames = 32          # a power-up rises out of its box for 32 frames ...
rise_speed = 128          # ... at 0.5 px/frame (16 px)
mozartkugel_speed = 256   # 1.0 px/frame rolling
zaunerstollen_speed = 320 # 1.25 px/frame rolling
pop_speed = 1280          # 5 px/frame: an Oblate from a box pops up ~2 tiles ...
pop_frames = 28           # ... and disappears (collected) after this many frames
bump_frames = 8           # a hit block moves up and down again over 8 frames ...
bump_px = 4               # ... by 4 px
debris_speed_x = 256      # 1 px/frame sideways
debris_speed_high = 1280  # upper pieces fly up at 5 px/frame
debris_speed_low = 768    # lower pieces at 3 px/frame
multi_oblaten = 10        # an oblaten_10 brick pays up to 10 Oblaten ...
multi_frames = 240        # ... or until 4 s after the first hit

[score]
oblate = 200
power_up = 1000
brick = 50
stomp_chain = [100, 200, 400, 800, 1000, 2000, 4000, 8000]  # then +1 life per stomp
bump_enemy = 100          # an enemy standing on a block that is bumped from below
time_bonus = 50           # per second left at the goal, tallied 1 s per frame
popup_frames = 30         # score popups float up 16 px over 30 frames
popup_rise = 16

[enemies]
selfie_tourist_hitbox = [12, 20]          # px [w, h]
taube_hitbox = [12, 10]
mozartkugel_verkaeufer_hitbox = [12, 22]
fiaker_hitbox = [44, 28]
thrown_hitbox = [6, 6]                    # the thrown (unwrapped) Mozartkugel
nordic_walker_hitbox = [12, 22]
blasmusiker_hitbox = [12, 22]             # sprite 24x24, the tuba sticks out
note_hitbox = [6, 6]
e_biker_hitbox = [26, 20]
bienenschwarm_hitbox = [14, 14]           # centred on its path
# Distances to the player are measured horizontally, centre to centre, in whole px.
# All patterns are frame counters from activation (D-017), never the RNG.
tourist_speed = 128           # 0.5 px/frame; gravity and max fall speed are the player's
tourist_selfie_period = 240   # every 240 frames (from activation) a selfie ...
tourist_selfie_frames = 48    # ... standing still for 48 frames
tourist_flash_at = 24         # the flash shows at frame 24 of the selfie ...
tourist_flash_frames = 2      # ... for 2 frames (harmless, renderer only)
taube_speed = 192             # 0.75 px/frame to the left, ignores tiles
taube_amplitude = 16          # px: sine wave around its start height (rises first)
taube_period = 120            # frames per sine wave
taube_sitting_trigger = 96    # px (6 tiles): a sitting Taube takes off when the player is this close ...
taube_rise = 16               # ... rises 16 px ...
taube_rise_frames = 16        # ... over 16 frames, then flies like a Taube
verkaeufer_range = 160        # px (10 tiles): the throw counter runs while the player is this close
verkaeufer_period = 120       # a throw every 120 frames of that counter ...
verkaeufer_windup = 20        # ... the last 20 of them winding up (arm raised)
verkaeufer_throw_pose = 12    # frames the throw pose shows after a throw
thrown_speed_x = 320          # 1.25 px/frame towards the player's side
thrown_speed_y = 768          # 3.0 px/frame upwards at the throw ...
thrown_gravity = 32           # ... 0.125 px/frame²: apex ~36 px, ~4 tiles range at throw height
fiaker_trigger = 128          # px (8 tiles): the parked Fiaker telegraphs ...
fiaker_telegraph = 40         # ... for 40 frames ...
fiaker_speed = 512            # ... then charges left at 2.0 px/frame until it leaves the screen
walker_speed = 192            # Nordic-Walker: 0.75 px/frame; turns at walls, enemies on foot and ledges (D-046)
blasmusiker_range = 160       # px (10 tiles): the bar counter runs while the player is this close (pauses outside)
blasmusiker_bar = 180         # frames per bar ...
blasmusiker_inhale = 30       # ... frames 0-29 inhale (the telegraph) ...
blasmusiker_notes = [30, 54, 78]  # ... notes at these bar frames („Hum-ta-ta") ...
blasmusiker_blow_pose = 8     # ... each showing the blow pose for 8 frames
note_speed = 256              # 1.0 px/frame straight towards his facing side ...
note_range = 160              # ... for at most 160 px; vanishes on solid tiles, passes one-way tiles and enemies
note_height = 10              # px: note centre above the musician's feet ...
note_ahead = 10               # ... and in front of his centre
e_biker_trigger = 144         # px (< 145, 9 tiles): the parked E-Biker telegraphs ...
e_biker_telegraph = 40        # ... for 40 frames ...
e_biker_speed = 512           # ... then rides left at 2.0 px/frame with the player's gravity; a wall makes it crash
e_biker_crash_frames = 30     # crash pose with „Hoppala!", then removed (no points)
swarm_return_frames = 64      # Bienenschwarm: half-circle return to its anchor; the run is 1 px/frame,
                              # so the period is 2 × (len × 16 + 64) frames
swarm_shake = 2               # renderer only: ±2 px across the run ...
swarm_shake_frames = 4        # ... switching every 4 frames
squish_frames = 30            # a stomped enemy stays visible (squished) this long
knock_speed = 768             # 3 px/frame: upward speed of an enemy or item knocked by a bumped block
bounce_grace_frames = 8       # a bounce off the Fiaker puts the feet on its top; if a solid or hazard tile is in the way,
                              # non-stompable enemies do no harm for this many frames instead (>= 2, D-027)
# M3 enemies (D-058). Pilger and Gams use the player's max fall speed when they fall off something.
pilger_hitbox = [12, 22]      # sprite 16x24 (`lead`: 16x32 with a pennant, same hitbox)
pilger_speed = 128            # 0.5 px/frame towards the player; turns at walls and enemies on foot, walks off ledges
gams_hitbox = [16, 14]        # sprite 24x20
gams_stand = 60               # Gams cycle from activation: stand 60 ...
gams_crouch = 16              # ... crouch 16 (the telegraph; it picks its hop direction at the crouch's start) ...
gams_hop_speed_x = 256        # ... hop: 1.0 px/frame across (2 tiles over the hop) ...
gams_hop_speed_y = 1024       # ... 4.0 px/frame up ...
gams_gravity = 64             # ... 0.25 px/frame²: apex 30 px, lands on frame 32 at the same height
gams_hop_tiles = 2            # the landing cell it checks: this many tiles ahead (= vx × 32 frames)
stein_hitbox = [12, 12]       # the falling rock (sprite 16x16, origin 8,14)
stein_gravity = 64            # 0.25 px/frame² ...
stein_max_fall = 1024         # ... max 4.0 px/frame
steinschlag_telegraph = 40    # Steinschlag counter frames 0-39 wobble + pebbles, the rock drops at frame 40 ...
steinschlag_refill = 30       # ... and the niche shows a resting rock again 30 frames after the drop
steinschlag_screen_top = 24   # px: the niche counts as on screen only below the HUD (screen y >= 24)
stein_points = 50             # a rock shattered by a thrown Hackl (D-056)
# M4 enemies (D-068, D-069).
operettensaenger_hitbox = [12, 22]  # sprite 16x24
operettensaenger_range = 160  # px (< 161, 10 tiles): his 180-frame counter runs while the player is this close
operettensaenger_cycle = 180  # frames per cycle (starts at 0 on first entering range, pauses outside) ...
operettensaenger_inhale = 40  # ... frames 0-39 inhale (the telegraph) ...
operettensaenger_sing = 48    # ... frames 40-87 the high C sounds; idle 88-179 (the 92-frame window)
hohes_c_width = 12            # px: the sound column, centred on him, grows up from his hitbox top ...
hohes_c_speed = 8             # ... 8 px per frame ...
hohes_c_height = 80           # ... to 80 px; passes one-way tiles, stops at the first solid tile
souvenirstand_telegraph = 30  # stand counter frames 0-29 telegraph (vendor holds up a globe), the globe spawns at frame 30
souvenirstand_max_alive = 2   # a cycle that starts with this many of its globes alive shows nothing and spawns nothing
schneekugel_hitbox = [10, 10] # the rolling snow globe (sprite 12x12)
schneekugel_speed = 256       # 1.0 px/frame to the left; gravity and max fall are the player's; shatters on walls
# M4 Reisebus (D-070): parked, facing left; it ignores tiles (levels keep its lane clear, lint) and passes enemies.
reisebus_hitbox = [60, 28]    # sprite 64x32 over 4 cells from its spawn cell
reisebus_trigger = 160        # px (< 161, 10 tiles) to its centre: the parked bus telegraphs ...
reisebus_telegraph = 60       # ... for 60 frames (hazard lights) ...
reisebus_speed = 384          # ... then drives left at 1.5 px/frame until its right edge is left of the screen
reisebus_stop_frames = 120    # `stop = N`: N tiles left of where it was parked it halts for a 120-frame photo stop ...
reisebus_restart = 30         # ... then 30 frames of hazard lights, then on again
reisebus_flash_frames = 16    # renderer: the photo-stop camera flashes switch every 16 frames (off first; harmless)
# M5 lake enemies (D-078 … D-080). Until E27's swim water lands they use `wolfgangsee_water` as their surface.
schwan_hitbox = [16, 12]      # sprite 24x24; floats in a surface-row water cell ...
schwan_float_px = 4           # ... its hitbox bottom 4 px below the water line (top 8 px below the decks)
schwan_range = 96             # px (< 97, 6 tiles): a rested swan at home, fully on screen, triggers ...
schwan_telegraph = 32         # ... hisses for 32 frames ...
schwan_charge_speed = 384     # ... charges towards the player's side at 1.5 px/frame ...
schwan_charge_frames = 64     # ... for 64 frames (96 px), ignoring tiles ...
schwan_return_speed = 128     # ... paddles home at 0.5 px/frame ...
schwan_rest = 60              # ... and rests 60 frames (cycle 32 + 64 + 192 + 60 = 348 frames)
gelse_hitbox = [8, 8]         # sprite 16x16, the hitbox centred in its cell
gelse_wait = 60               # it hovers until it has been fully on screen for 60 frames (the telegraph) ...
gelse_hunt = 480              # ... then hunts for 480 frames ...
gelse_accel = 8               # ... each axis 1/32 px/frame² towards its target ...
gelse_speed = 192             # ... at most 0.75 px/frame per axis ...
gelse_target_dy = 4           # ... the target: her hitbox centre x, her hitbox top + 4 px; it never enters water
gelse_leave_speed = 256       # then it leaves (harmless) straight up at 1 px/frame, removed above the screen
regattaboot_hitbox = [24, 56] # sprite 32x64 over 2 cells of the surface row, from the masthead ...
regattaboot_keel_px = 12      # ... to the keel 12 px below the water line (a diver 13 px down passes)
regattaboot_mast = [8, 20]    # the masthead part (centred, from the top) is all that bounces a falling Resi; below it the 24 px body hurts
regattaboot_trigger = 160     # px (< 161, 10 tiles) to its centre, and fully on screen: it telegraphs ...
regattaboot_telegraph = 60    # ... for 60 frames (start flag, horn) ...
regattaboot_speed = 384       # ... then races left at 1.5 px/frame through everything until it leaves the screen
# M6 Offizier (D-096): a drill on the stage clock, f = (clock + level `phase`) mod offizier_cycle.
offizier_hitbox = [12, 22]    # sprite 16x32 (`lead`: the flag bearer, same hitbox)
offizier_speed = 128          # 0.5 px/frame while marching; faces the player at activation; Nordic-Walker turns (walls, enemies on foot, ledges)
offizier_cycle = 240          # frames per drill: march f 0-167 ...
offizier_march = 168          # ... halt for „Habt Acht!" (the telegraph) f 168-191 ...
offizier_attention = 24       # ... and „Präsentiert!" f 192-239 (the rest of the cycle, 48 frames): the sabre zone is up
offizier_sabre = [8, 16]      # px [w, h]: the sabre zone, centred on him, from his hitbox top up; hurts on any contact, checked before the stomp

[platforms]
festungsbahn_size = [48, 24]    # px [w, h]: the car is 3 tiles wide, its top surface carries the player
festungsbahn_travel = 150       # frames from one end point to the other (straight line)
festungsbahn_wait = 60          # frames standing at the upper end (at the lower end it waits for its rider, D-030)
gondel_size = [32, 24]          # px [w, h]: the cabin; its roof carries the player (the 28 px hanger is drawn above)
gondel_wait = 30                # frames at each end; it never waits for a rider (D-044)
gondel_frames_per_tile = 16     # 1 px/frame along the major axis: travel = max(|dx|, |dy|) × 16 frames
schafbergbahn_size = [64, 32]   # px [w, h], whole tiles: the train body; its roof is flush with the station platforms (D-067)
schafbergbahn_frames_per_tile = 24  # travel = max(|dx|, |dy|) × 24 frames: 0.67 px/frame across a 1:4 track
schafbergbahn_wait = 90         # frames standing at the upper end (at the lower end it waits for its rider)
traundl_size = [48, 16]         # px [w, h]: the Traundl's flat hull; its top is the deck, flush with every row-11 deck (D-077)
traundl_wait = 30               # frames at each end; it never waits for a rider (the Gondel's machine, D-044)
traundl_frames_per_tile = 16    # 1 px/frame: travel = |dx| × 16 frames (to = [6, 0]: a 252-frame period)
dampfer_size = [160, 16]        # px [w, h], whole tiles: the paddle steamer's hull; its top is the deck, flush with the quays (D-077)
dampfer_frames_per_tile = 20    # travel = dx × 20 frames (0.8 px/frame, >= the auto-scroll's 0.75); it waits for its rider, then stays moored
dampfer_wheel_zone = [32, 20]   # px [w, h]: the paddle wheel's hurt zone while it travels, centred on the hull's centre x
dampfer_wheel_rise = 4          # px the wheel zone's top is above the hull's bottom (the water line); the rest is under it

[goal]
zone_heights = [32, 64, 96, 112]          # px of the feet above the Maibaum base at the touch: 2/4/6/7 tiles (D-038)
zone_scores = [100, 400, 800, 2000, 5000] # per zone; the last one (>= 7 tiles) is the Wurstkranz
pole_offset = 2           # px: Resi's hitbox edge to the pole centre while sliding / hopping off
slide_speed = 512         # 2 px/frame down the pole
hop_speed = 512           # 2 px/frame up when hopping off at the base (gravity as the player's)
clear_frames = 180        # stage-clear texts after the time-bonus tally
to_be_continued_frames = 180  # „Fortsetzung folgt …", then the title screen (M1)

[map]
arrive_frames = 40        # route map: Resi idle on the cleared station (D-043)
done_frame = 20           # ... whose marker turns `done` at this frame of the arrival
walk_px = 1               # px/frame along the route to the next station
wait_frames = 300         # on the next station: START or this many frames → next stage intro
teaser_frames = 180       # next station has no level yet: „Fortsetzung folgt …", then the title

[hackl]
item_hitbox = [12, 12]    # px [w, h]: the Hackl power-up from an H-box; it rises like the others (items.rise_*), then stays put
axe_hitbox = [8, 8]       # px: a thrown axe (sprite hackl_thrown 12x12)
max_alive = 2             # a new RUN press throws only while fewer axes are alive (D-056)
throw_speed_x = 768       # 3.0 px/frame towards the facing side, independent of Resi's speed ...
throw_speed_y = 768       # ... 3.0 px/frame up ...
gravity = 48              # ... 0.1875 px/frame²: apex ~24 px after 16 frames, back at hand height after 32 frames (6 tiles)
max_fall_speed = 1024     # 4.0 px/frame
throw_ahead = 8           # px: the axe's centre at the throw is in front of Resi's centre ...
throw_below_top = 10      # ... and this far below her hitbox top
throw_pose_frames = 10    # the `throw` pose (frame 0 for 4 ticks, frame 1 for 6: the anim decides)
stuck_frames = 20         # an axe stuck in a solid tile stays (harmless) this long
                          # (an axe shatters a falling rock for enemies.stein_points)

[crawl]
hitbox = [12, 12]         # px [w, h] while crawling through the Durchkriechstein (D-057)
speed = 256               # 1.0 px/frame to the right; len 4 → 4 × 16 + 12 = 76 frames
mouth_px = 4              # DOWN starts the crawl when her right edge is at most this far left of the mouth
cap_points = 1000         # Normal at the lives cap: points instead of the +1 life

[swim]
# Swimming in swim water (`TileKind::Swim`: see_wasser, see_wasser_tief, steg_pfahl; D-076).
# The same numbers in every form; lethal water (D-050) is unchanged.
chest_px = 8              # px: her chest point is the hitbox centre x, this far below the hitbox top; in a swim tile = swimming
surface_band = 8          # px: chest less than this below a swim surface = at the surface (floats; JUMP = jump-out)
gravity = 16              # 0.0625 px/frame² while sinking (DOWN held at the surface, or anywhere below the band) ...
max_sink = 256            # ... up to 1.0 px/frame
stroke_speed = 448        # a JUMP press below the band: 1.75 px/frame up, rises ~24 px over 28 frames (jump-out: player.jump_speed_walk)
accel = 16                # 0.0625 px/frame² towards ±speed with LEFT/RIGHT ...
decel = 8                 # ... 0.03125 px/frame² towards 0 without ...
speed = 320               # ... 1.25 px/frame, RUN makes no difference (faster than the auto-scroll's 0.75)
