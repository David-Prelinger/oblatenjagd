# All player-visible German text, keyed. Code only references the keys
# (e.g. "stage.clear"); see docs/architecture.md "Text" and the
# german-satire-writing skill for tone. Tables flatten to dotted keys.
# Limits: UI lines <= 24 characters; signs <= 2 lines of <= 12 characters
# ("\n" separates the lines); only characters of the font charset (D-012).
# The key list and where each text appears: docs/game-design.md "UI text".

[title]
name = "Oblatenjagd"
subtitle = "Salzburg – Bad Ischl"
press_start = "Drück START, oida"
# M7: the title after the ending, for the rest of the session (D-107).
cleared = "Durchgespielt! Mahlzeit!"
press_start_again = "Nochmal? Drück START"

[hud]
score = "PUNKTE"
oblaten = "OBLATEN"
lives = "LEBEN"
time = "ZEIT"

[ui]
pause = "Jausenpause"
game_over = "Aus is'! Spiel vorbei."
continue = "Weiter? Drück START"
time_up = "Zeit is' um!"
to_be_continued = "Fortsetzung folgt …"

[popup]
extra_life = "+1 Leben"
checkpoint = "Zwischenstopp"
wurstkranz = "Wurstkranz!"
hoppala = "Hoppala!"
# M3: picking up St. Wolfgang's Hackl; a big Resi leaving the Durchkriechstein as Normal.
hackl = "Wirf, Resi, wirf!"
ballast = "Ballast weg!"
# M4: an Operettensänger is defeated (stomp or axe).
bravo = "Bravo!"
# M5: a Schwan is defeated (stomp or axe) and sulks.
beleidigt = "Beleidigt!"
# M6: a Kurgast lies down in his deck chair after a stomp.
kurruhe = "Kurruhe!"
# M6: an Offizier is defeated (stomp, axe or a bumped block).
abtreten = "Abtreten!"
# M7: Resi bounces off a Kellner's tray (D-105).
komm_gleich = "Komm' gleich!"
# M7: the Oberkellner: the arena locks; his first and second hit; the third (D-106).
anstellen = "Hinten anstellen!"
unerhoert = "Unerhört!"
bitte_sehr = "Bitte sehr!"
# M7: touching the armed Zaunerstollen on the counter (D-107).
stollen = "Zaunerstollen!"

