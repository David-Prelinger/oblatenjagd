map_note = "Zu Fuß. Ohne Bus 150."
# Scene phase: three lines under the picture.
scene_1 = "Endlich: Zaunerstollen!"
scene_2 = "Draußen fährt Bus 150."
scene_3 = "Voll. Ist Resi wurscht."
# Bill phase: labels (the engine draws the numbers).
