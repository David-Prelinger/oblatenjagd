[package]
name = "jnr-artkit"
description = "Text-based pixel-art pipeline: .palette/.sprite parsing, generators, atlas packing, lints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Generator params (art/generators/*.toml). Pure and wasm-safe (jnr-core uses them too).
serde = { workspace = true }
toml = { workspace = true }
png = { workspace = true, optional = true }

[features]
# PNG encoding for previews (xtask only); jnr-assets/wasm builds never need it.
png = ["dep:png"]
